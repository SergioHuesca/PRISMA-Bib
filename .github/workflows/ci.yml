# CI pipeline, BUILD_PLAN.md §3.7.7.
#
# The job names `lint`, `fast`, `full`, and `docs` are the required status checks on
# `main` (§3.6.3). Renaming one silently makes the branch unmergeable, because branch
# protection waits forever on a context that never reports. `full` is an aggregator over
# the 3.11/3.12 matrix for exactly this reason: a matrix job publishes `full (3.11)` and
# `full (3.12)`, never a bare `full`.
#
# Jobs added in later stages: `notebooks` (Stage 5), `gates` (with the coverage/diff-cover
# thresholds). Each is added to the required list in the stage that introduces it — a
# required check with no tests behind it blocks every PR. `e2e` arrived in Stage 4 and is
# deliberately not in the required list until it has passed on `main` at least once, for
# the same reason.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Pinned to the uv that wrote uv.lock. An older uv cannot read a newer lockfile
  # format, which fails at `uv sync` with a confusing schema error.
  UV_VERSION: "0.11.26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict src/prismabib

  fast:
    name: fast
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Fast tests (unit + contract)
        run: uv run pytest -m "unit or contract" -n auto

  full-matrix:
    name: full-matrix
    runs-on: ubuntu-latest
    needs: [fast]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Full suite with coverage
        run: uv run pytest -m "not live and not e2e" -n auto --cov --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 5

  # Publishes the single `full` check context that branch protection requires.
  full:
    name: full
    runs-on: ubuntu-latest
    needs: [full-matrix]
    if: always()
    steps:
      - name: Propagate full-matrix result
        run: |
          result="${{ needs.full-matrix.result }}"
          echo "full-matrix result: $result"
          if [[ "$result" != "success" ]]; then
            exit 1
          fi

  # The only job that runs on Windows, and the only evidence that prismabib works there.
  #
  # `prisma/log.py` now has two file-locking backends, and the Windows one is exercised
  # everywhere else against an injected stand-in for `msvcrt.locking`. A fake that agrees
  # with itself proves the backend's logic is self-consistent and nothing at all about
  # `msvcrt`; this job is what checks the model against the machine. It is also the only
  # place the `O_BINARY` flags matter — on Linux `os.O_BINARY` does not exist and the
  # flag is 0, so a regression there is invisible to every other check.
  #
  # DELIBERATELY NOT A REQUIRED CHECK YET, following this repository's own precedent for
  # `e2e` (see its header above): a required check with no passing history blocks every
  # PR the first time it goes red for a reason nobody has seen before, and no Windows
  # machine was available while this was written. Expect it to surface further
  # Windows-only failures in code paths this change did not touch — subprocess and `git`
  # invocations in the test helpers are the likely first ones. Add it to the required set
  # in the same change that makes it green on `main`, exactly as `e2e` was.
  #
  # Python 3.12 only: the 3.11/3.12 split is about typing and stdlib behaviour, which
  # `full-matrix` already covers. What this job varies is the operating system.
  # `lint` and `docs` stay ubuntu-only — ruff, mypy and mkdocs have no OS-dependent
  # behaviour this project relies on, and duplicating them would double the required
  # surface for no signal.
  full-windows:
    name: full-windows
    runs-on: windows-latest
    needs: [fast]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # Same selection as `full`, without the coverage report: the per-module gates are
      # measured once, on Linux, by `full-matrix`. What is wanted here is pass/fail.
      - name: Full suite on Windows
        run: uv run pytest -m "not live and not e2e" -n auto

  # BUILD_PLAN §3.7.7: "e2e — pytest -m e2e (single job, ubuntu, py3.12)". Layer 0 through
  # to FlowCounts on the frozen reference project, which is the only check that the
  # stages compose; `full` deselects it (`-m "not live and not e2e"`) because it is slow
  # and because a matrix would run it twice for no extra signal.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # The explicit -m overrides the `-m "not live"` in pyproject's addopts — the same
      # mechanism the nightly `live` job relies on.
      - name: End-to-end suite (reference project)
        run: uv run pytest -m e2e

  # Stage 5. Deliberately NOT in the required-check set yet: the same precedent as
  # `e2e` and `full-windows` -- a required check that has never passed can wedge the
  # branch, so it is promoted only after it has run green on `main`.
  notebooks:
    name: notebooks
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # The notebook screens a real project, so it needs one. The committed
      # reference fixture is copied to a scratch projects root rather than used
      # in place: executing it builds a Layer 1 store, and a fixture that is
      # byte-frozen (BUILD_PLAN line 536) must not gain one as a side effect of
      # a CI run.
      - name: Stage the reference project
        run: |
          mkdir -p "$RUNNER_TEMP/projects"
          cp -a tests/fixtures/projects/reference "$RUNNER_TEMP/projects/"

      - name: Execute notebooks
        env:
          # No SCOPUS_API_KEY: the notebook reads an existing Layer 0 archive
          # and makes no network call, so it needs no credential -- and a
          # placeholder value here trips detect-secrets, correctly.
          PRISMABIB_PROJECTS_ROOT: ${{ runner.temp }}/projects
        run: uv run pytest --nbmake notebooks/ -q

  # The per-module coverage gates of BUILD_PLAN §3.7.6, which `[tool.prismabib.coverage_gates]`
  # has declared since Stage 2 while nothing enforced them -- only the global
  # `fail_under = 85` ran, so a module could sit far below its own stated floor and CI
  # stayed green. Stood up at Stage 10 because `report/` declares 90% and shipping the
  # export path under an unenforced gate is exactly the kind of gap this project files.
  #
  # Non-required initially, on the `e2e`/`full-windows`/`notebooks` precedent: an unproven
  # job must not block every merge. Promote it once it is green on `main`.
  gates:
    name: gates
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Measure coverage
        run: uv run pytest -m "not live" -q --cov=prismabib --cov-report=json:coverage.json --cov-branch

      - name: Enforce the per-module gates
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          coverage = json.loads(Path("coverage.json").read_text())["files"]
          gates = tomllib.loads(Path("pyproject.toml").read_text())
          gates = gates["tool"]["prismabib"]["coverage_gates"]

          def aggregate(prefix: str) -> tuple[int, int, int, int]:
              """Sum statements and branches over every file under `prefix`."""
              statements = covered = branches = branches_covered = 0
              for name, data in coverage.items():
                  normalised = name.replace("\\", "/")
                  if normalised == prefix or normalised.startswith(prefix.rstrip("/") + "/"):
                      summary = data["summary"]
                      statements += summary["num_statements"]
                      covered += summary["covered_lines"]
                      branches += summary.get("num_branches", 0)
                      branches_covered += summary.get("covered_branches", 0)
              return statements, covered, branches, branches_covered

          failures = []
          rows = []
          for target, spec in sorted(gates.items()):
              if target == "global":
                  continue
              statements, covered, branches, branches_covered = aggregate(target)
              if statements == 0:
                  # A module a later stage owns. Not a failure: the gate is declared
                  # ahead of the code on purpose, so the floor exists on the day the
                  # module lands rather than being negotiated then.
                  rows.append(f"| `{target}` | not built yet | — | — |")
                  continue
              line = 100.0 * covered / statements
              branch = 100.0 * branches_covered / branches if branches else 100.0
              line_gate = float(spec.get("line", 0))
              branch_gate = float(spec.get("branch", 0))
              ok = line >= line_gate and branch >= branch_gate
              if not ok:
                  failures.append(
                      f"{target}: line {line:.2f}% (gate {line_gate:.0f}%), "
                      f"branch {branch:.2f}% (gate {branch_gate:.0f}%)"
                  )
              rows.append(
                  f"| `{target}` | {line:.2f}% / {line_gate:.0f}% | "
                  f"{branch:.2f}% / {branch_gate:.0f}% | {'ok' if ok else '**FAIL**'} |"
              )

          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as handle:
              handle.write("## Per-module coverage gates (BUILD_PLAN §3.7.6)\n\n")
              handle.write("| target | line / gate | branch / gate | |\n")
              handle.write("| --- | --- | --- | --- |\n")
              handle.write("\n".join(rows) + "\n")

          for failure in failures:
              print(f"::error::coverage gate breached -- {failure}")
          sys.exit(1 if failures else 0)
          PY

  # `needs: [full]`, not `needs: [e2e]`, on purpose: `docs` is a required check and `e2e`
  # is not one yet, so chaining them would let an unproven job block every merge. Move
  # this to `needs: [e2e]` in the same change that makes `e2e` required.
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict
