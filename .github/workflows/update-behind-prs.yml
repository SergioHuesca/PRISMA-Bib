# Keep open PRs current with main after every squash-merge.
#
# !! TOKEN TRADE-OFF - THE OWNER MUST DECIDE !!
# Pushes made with the default GITHUB_TOKEN do NOT trigger new workflow runs, so a PR
# updated by this job gets NO checks and stays unmergeable on the required checks.
# For checks to start, set the repo secret PR_UPDATE_TOKEN to a GitHub App installation
# token or a fine-grained PAT (Contents: write, Pull requests: write on this repo only).
# This workflow does not create or store any secret. Without it, it falls back to
# GITHUB_TOKEN: branches get updated, but checks must be re-triggered by hand.
#
# It never merges, closes, approves, or edits PR contents.

name: Update behind PRs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: update-behind-prs
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update BEHIND pull requests
        run: |
          # ponytail: one pass; a PR whose state is still UNKNOWN is skipped until the next push.
          for n in $(gh pr list --base main --state open --json number --jq '.[].number'); do
            s=$(gh pr view "$n" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$s" != "BEHIND" ]; then echo "PR #$n: $s, skipping"; continue; fi
            echo "PR #$n: BEHIND, updating"
            gh pr update-branch "$n" || { echo "PR #$n: update failed"; continue; }
            gh pr comment "$n" --body "Branch updated from main at ${GITHUB_SHA}. A reviewer must confirm that the update brings in only main's changes before merge."
          done
