# Keep the next PR to merge current with main.
#
# !! OWNER SETUP REQUIRED !!
# Pushes made with the default GITHUB_TOKEN do NOT trigger new workflow runs, so updated
# PRs would get no checks. This job therefore mints a GitHub App installation token. The
# owner must create the GitHub App (Contents: write, Pull requests: write, installed on
# this repo only) and set two repo secrets: APP_CLIENT_ID (the App's Client ID, not the
# numeric App ID; the owner must ADD this) and APP_PRIVATE_KEY. This workflow does not
# create or store any secret. Until they exist, the token step fails the job.
#
# A failed update or comment is reported as a warning and a step-summary note; it does not
# fail the run. A failed listing call or token step still fails the job, so real faults stay
# visible. The job never blocks main. It never merges, closes, approves, or edits PR contents.
#
# Triggers: push to main (a merge changes the queue); workflow_run of CI completing (a PR's
# checks finishing is what ends "CI running", so the queue can change); workflow_dispatch.
# No trigger here checks out or runs PR-controlled code, and the App token never sees one.
#
# Rule (scripts/next_pr_to_update.py): only the head of the queue is ever updated. The head
# is the lowest-numbered open PR targeting main, drafts included (INCLUDE_DRAFTS in the
# script), skipping PRs whose mergeStateStatus is DIRTY (conflicts a bot update cannot fix).
# The head is updated if and only if it is BEHIND and has no queued or in-progress checks.
#
# Starvation caveat: a permanently red or conflicting PR at the head blocks automation for
# the others until it merges or is closed. DIRTY PRs are skipped, so only red or stalled
# non-conflicting PRs can block. Red PRs are not skipped by design.

name: Update behind PRs

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-behind-prs
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No `ref:` on purpose. On workflow_run the default checkout is the default branch
      # (main), so the script and this workflow are main's code. Passing the triggering
      # run's ref would check out PR-controlled code while the App token is in scope.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actions/create-github-app-token v3.3.0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update the next PR to merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs="$RUNNER_TEMP/prs.json"
          gh pr list --base main --state open --limit 500 \
            --json number,isDraft,mergeStateStatus,statusCheckRollup > "$prs"
          # mergeStateStatus is computed lazily: re-read each UNKNOWN PR, up to ~60s (6 x 10s).
          for n in $(jq -r '.[] | select(.mergeStateStatus == "UNKNOWN") | .number' "$prs"); do
            for i in 1 2 3 4 5 6; do
              rec=$(gh pr view "$n" --json number,isDraft,mergeStateStatus,statusCheckRollup)
              if [ "$(jq -r .mergeStateStatus <<<"$rec")" != UNKNOWN ]; then break; fi
              echo "PR #$n: UNKNOWN, retry $i/6"; sleep 10
            done
            if [ "$(jq -r .mergeStateStatus <<<"$rec")" = UNKNOWN ]; then
              echo "::warning::PR #$n still UNKNOWN after 60s; not a candidate this run"
              echo "PR #$n: still UNKNOWN after 60s; needs a manual check" >> "$GITHUB_STEP_SUMMARY"
            fi
            jq --argjson r "$rec" 'map(if .number == $r.number then $r else . end)' "$prs" > "$prs.new" && mv "$prs.new" "$prs"
          done
          next=$(python3 scripts/next_pr_to_update.py < "$prs")
          if [ -z "$next" ]; then
            echo "Nothing to update: the next PR to merge is not BEHIND, or its checks are still running."
            exit 0
          fi
          echo "Next PR to merge: #$next is BEHIND; updating"
          if gh pr update-branch "$next" &&
            gh pr comment "$next" --body "Branch updated from main at ${GITHUB_SHA}. A reviewer must confirm that the update brings in only main's changes before merge."; then
            :
          else
            echo "::warning::PR #$next: update or comment failed; it stays BEHIND until the next trigger"
            echo "PR #$next: update or comment failed" >> "$GITHUB_STEP_SUMMARY"
          fi
