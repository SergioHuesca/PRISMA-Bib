# Keep PRs current with main, and merge a batch in order when the merge train is on.
#
# !! OWNER SETUP REQUIRED !!
# Pushes made with the default GITHUB_TOKEN do NOT trigger new workflow runs, so updated
# PRs would get no checks. This job therefore mints a GitHub App installation token. The
# owner must create the GitHub App (Contents: write, Pull requests: write, installed on
# this repo only) and set two repo secrets: APP_CLIENT_ID (the App's Client ID, not the
# numeric App ID; the owner must ADD this) and APP_PRIVATE_KEY. This workflow does not
# create or store any secret. Until they exist, the token step fails the job.
# The train also needs the label train:halted to exist (gh pr edit fails otherwise).
#
# A failed update or comment is reported as a warning and a step-summary note; it does not
# fail the run. A failed listing call or token step still fails the job, so real faults stay
# visible. Update-only mode never merges, closes, approves, or edits PR contents.
#
# Triggers: push to main (a merge changes the queue); workflow_run of CI or Docs completing
# (a PR's checks finishing is what ends "CI running", so the queue can change; Docs is a
# separate workflow whose checks are in the same rollup, so it needs its own trigger or a
# head waiting on Docs would stall); workflow_dispatch.
# No trigger here checks out or runs PR-controlled code, and the App token never sees one.
#
# MERGE TRAIN (scripts/train_step.py). Off unless the repository variable MERGE_TRAIN is "on".
# A batch is the open PRs labelled train:1, train:2, ... (drafts until the batch starts).
# Starting = set MERGE_TRAIN to on and dispatch this workflow. A run acts only on the train
# head, the lowest N among open PRs. Its single label reviewed:<40 hex> names the commit a
# reviewer approved. scripts/train_verify_head.py decides whether the head is that commit plus
# only verified update merges of main (byte-exact diffs, no other change, no overlap with the
# PR's own edits; except paths main changed that the head already holds, e.g. a merged parent
# PR of a stacked PR, which are absorbed: rule f; or the whole update is exactly git's clean
# automatic merge of the head and main, rule g). The head is squash-merged, pinned to its
# head sha, only when it is not a
# draft; mergeStateStatus is CLEAN; every check is SUCCESS, SKIPPED or NEUTRAL with none queued
# or running; and the verification passed. No batch PR may sit below the head closed unmerged
# (the closed list is checked). Lists are capped at 100; a full list halts.
# Otherwise: BEHIND with no running check -> update-branch; running checks -> wait; anything
# unexpected -> halt: label the head train:halted and post one comment with the reason. While
# any open PR has train:halted, every run does nothing. Resume = fix it, remove the label,
# dispatch. The train never skips a PR, never merges out of order, and never retries a failed
# check. Full rules: docs/how-to/merge-train.md.
#
# Update-only mode (no train:N labels, or MERGE_TRAIN not on). Rule (scripts/next_pr_to_update.py):
# only the head of the queue is ever updated. The head is the lowest-numbered open PR targeting
# main, drafts included (INCLUDE_DRAFTS in the script), skipping PRs whose mergeStateStatus is
# DIRTY (conflicts a bot update cannot fix). The head is updated if and only if it is BEHIND and
# has no queued or in-progress checks.
#
# NATIVE STACKED PRs (ADR 0037, DRAFT, off unless the repository variable MERGE_TRAIN_STACKS is
# "on"). With it off the lists still include every base (the head must be visible), but a
# non-stacked head merges exactly as above and a stacked head halts. With it on: scripts/
# train_facts.py reads the head's stack record; a position-2 child of a merged parent is verified
# with rule h (decide is called twice, see the comments below); a stacked head is merged with
# scripts/train_merge_async.py (never gh pr merge), audited in the same run, and a failed audit
# halts the lowest open train:N PR (train_step.py audit-stop). update-branch is never run on a
# stacked PR (HTTP 403). There is NO schedule trigger: it is added only if a rehearsal shows
# that no event fires after GitHub's rebase.
#
# Starvation and halt caveats: while a train runs, non-train PRs are not updated. A permanently
# red, stalled, abandoned-draft or CLEAN-but-unmerged PR at the head blocks update-only mode
# for the others until it merges or is closed. DIRTY PRs are skipped, so only non-conflicting
# PRs can block. A train head whose checks never report stays WAIT until a re-trigger.

name: Update behind PRs

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI", "Docs"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-behind-prs
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No `ref:` on purpose. On workflow_run the default checkout is the default branch
      # (main), so the scripts and this workflow are main's code. Passing the triggering
      # run's ref would check out PR-controlled code while the App token is in scope.
      # fetch-depth 0: the verification walks main's history and merge bases.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/create-github-app-token v3.3.0. Only these two permissions: the App was not
      # granted others, and requesting them would fail this step.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Decide and act (merge train or update-only)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_TRAIN: ${{ vars.MERGE_TRAIN }}
          # Rollback switch (ADR 0037): anything but "on" is off, and a stacked head halts.
          MERGE_TRAIN_STACKS: ${{ vars.MERGE_TRAIN_STACKS }}
        run: |
          # No --base filter (ADR 0037 Decision 3): a native child's base is its parent's branch
          # until GitHub retargets it, so a filter would hide it. Update-only mode filters on
          # baseRefName inside train_step.py. The same fields serve the post-merge re-list.
          list_open() {
            gh pr list --state open --limit 100 \
              --json number,state,isDraft,mergeStateStatus,headRefOid,labels,statusCheckRollup,baseRefName
          }
          prs="$RUNNER_TEMP/prs.json"
          list_open > "$prs"
          # Closed-unmerged PRs: a closed train:K below the head means the batch is broken.
          # Merged ones are excluded by the search. Passed to decide; a missing file halts.
          closed="$RUNNER_TEMP/closed.json"
          gh pr list --state closed --search "is:unmerged" --limit 100 \
            --json number,labels,mergedAt,baseRefName > "$closed"
          # mergeStateStatus is computed lazily: re-read each UNKNOWN PR, up to ~60s (6 x 10s).
          for n in $(jq -r '.[] | select(.mergeStateStatus == "UNKNOWN") | .number' "$prs"); do
            for i in 1 2 3 4 5 6; do
              rec=$(gh pr view "$n" --json number,state,isDraft,mergeStateStatus,headRefOid,labels,statusCheckRollup,baseRefName)
              if [ "$(jq -r .mergeStateStatus <<<"$rec")" != UNKNOWN ]; then break; fi
              echo "PR #$n: UNKNOWN, retry $i/6"; sleep 10
            done
            if [ "$(jq -r .mergeStateStatus <<<"$rec")" = UNKNOWN ]; then
              echo "::warning::PR #$n still UNKNOWN after 60s; the decision halts it if it is the head"
              echo "PR #$n: still UNKNOWN after 60s; needs a manual check" >> "$GITHUB_STEP_SUMMARY"
            fi
            jq --argjson r "$rec" 'map(if .number == $r.number then $r else . end)' "$prs" > "$prs.new" && mv "$prs.new" "$prs"
          done

          # The train head's verification. PR content is fetched as data and never checked out
          # or executed. A failed fetch or verify leaves the head check out, and decide halts it.
          verify=()
          facts_args=()
          stacks_on=off
          [ "${MERGE_TRAIN_STACKS:-off}" = on ] && stacks_on=on
          facts="$RUNNER_TEMP/facts.json"
          cand=$(python3 scripts/train_step.py candidate --merge-train "${MERGE_TRAIN:-off}" < "$prs")
          if [ -n "$cand" ]; then
            read -r n sha rsha <<<"$cand"
            vout="$RUNNER_TEMP/verify.json"
            stacked_path=false
            if [ "$stacks_on" = on ]; then
              # Stacks enabled: assemble the head's facts record (scripts/train_facts.py) from the
              # REST API. An unparseable record exits 2 and fails the step: nothing is merged.
              shas="$RUNNER_TEMP/shas.txt"
              git fetch --no-tags --quiet origin main || echo "::warning::fetching main failed"
              python3 scripts/train_facts.py --repo "$GH_REPO" --pr "$n" --out "$facts" --shas-out "$shas" ||
                { echo "::error::PR #$n: the facts record could not be assembled; nothing was merged"; exit 1; }
              facts_args=(--facts "$facts")
              if [ "$(jq -r '.stack != null and .stack.position >= 2' "$facts")" = true ]; then
                stacked_path=true
              fi
            fi
            if [ "$stacked_path" = true ]; then
              # TWO-STEP decide. The stacked verifier call needs the parent's commits, and only
              # decide knows them (verifier_args, built from the facts). decide needs the
              # verifier's result. So: decide WITHOUT --head-check first, only to read
              # verifier_args; then fetch by SHA (as data, never checked out or executed); run the
              # verifier; then the real decide below with --head-check. This first answer is
              # never acted on. A head with no verifier_args (parent not merged, no valid label,
              # position 3) gets no verifier and the real decide waits or halts it.
              pre=$(python3 scripts/train_step.py decide --merge-train "${MERGE_TRAIN:-off}" --closed "$closed" \
                --merge-train-stacks "${MERGE_TRAIN_STACKS:-off}" "${facts_args[@]}" < "$prs")
              mapfile -t vargs < <(jq -r '(.verifier_args // [])[]' <<<"$pre")
              sha_re='^[0-9a-f]{40}$'
              if [ "${#vargs[@]}" = 6 ] && [ "${vargs[0]}" = --parent-reviewed ] &&
                 [ "${vargs[2]}" = --parent-head ] && [ "${vargs[4]}" = --parent-merge ] &&
                 [[ "${vargs[1]}" =~ $sha_re && "${vargs[3]}" =~ $sha_re && "${vargs[5]}" =~ $sha_re ]]; then
                fetched=true
                # One fetch per sha: the facts script's list plus the head and its reviewed commit.
                mapfile -t want < <({ cat "$shas"; echo "$sha"; echo "$rsha"; } | sort -u)
                for s in "${want[@]}"; do
                  if [[ "$s" =~ $sha_re ]] && git fetch --no-tags --quiet origin "$s"; then :; else fetched=false; fi
                done
                if [ "$fetched" = true ] &&
                   python3 scripts/train_verify_head.py "$rsha" "$sha" --main origin/main "${vargs[@]}" > "$vout"; then
                  verify=(--head-pr "$n" --head-check "$vout")
                else
                  echo "::warning::PR #$n: stacked head verification did not run; the decision waits or halts it"
                fi
              fi
            elif git fetch --no-tags --quiet origin main &&
                 git fetch --no-tags --quiet origin "pull/$n/head" &&
                 python3 scripts/train_verify_head.py "$rsha" "$sha" --main origin/main > "$vout"; then
              verify=(--head-pr "$n" --head-check "$vout")
            else
              echo "::warning::PR #$n: head verification did not run; the decision halts it"
            fi
          fi

          out=$(python3 scripts/train_step.py decide --merge-train "${MERGE_TRAIN:-off}" --closed "$closed" \
            --merge-train-stacks "${MERGE_TRAIN_STACKS:-off}" "${facts_args[@]}" "${verify[@]}" < "$prs")
          action=$(jq -r .action <<<"$out")
          pr=$(jq -r '.pr // empty' <<<"$out")
          sha=$(jq -r '.head_sha // empty' <<<"$out")
          mode=$(jq -r .mode <<<"$out")
          reason=$(jq -r .reason <<<"$out")
          echo "$action (mode $mode): $reason"
          echo "- $action (mode $mode): $reason" >> "$GITHUB_STEP_SUMMARY"

          # A halt labels the head and says why. The reason is sanitised by the script, and it
          # is passed quoted.
          halt() {
            gh pr edit "$pr" --add-label train:halted &&
              gh pr comment "$pr" --body "Merge train halted: $1. Fix it, remove the train:halted label, then dispatch the update-behind workflow to resume."
          }
          case "$action" in
            halt)
              halt "$reason" || { echo "::error::PR #$pr: could not add train:halted or comment"; exit 1; }
              ;;
            merge)
              stacked=false
              if [ "$stacks_on" = on ] && [ "$(jq -r '.stack != null' "$facts")" = true ]; then
                stacked=true
              fi
              if [ "$stacked" != true ]; then
                # Not stacked: unchanged since before ADR 0037.
                if gh pr merge "$pr" --squash --match-head-commit "$sha"; then
                  echo "Merged #$pr (train head, head $sha)"
                else
                  halt "the squash merge of this head failed" || true
                  echo "::error::PR #$pr: squash merge failed; the train is halted"
                  exit 1
                fi
              else
                # Stacked: gh pr merge is refused for stacks. merge-async, pinned to the verified
                # head, then the audit in the same run (scripts/train_merge_async.py).
                sha_re='^[0-9a-f]{40}$'
                [[ "$sha" =~ $sha_re ]] || { echo "::error::PR #$pr: the decided head sha is malformed"; exit 1; }
                audit="$RUNNER_TEMP/audit.json"
                rm -f "$audit"
                res=$(python3 scripts/train_merge_async.py --repo "$GH_REPO" --pr "$pr" --head "$sha" --audit-file "$audit") || {
                  halt "the merge client failed to run" || true
                  echo "::error::PR #$pr: the merge client failed; the train is halted"
                  exit 1
                }
                outcome=$(jq -r .outcome <<<"$res")
                mreason=$(jq -r .reason <<<"$res")
                echo "- merge-async: $outcome: $mreason" >> "$GITHUB_STEP_SUMMARY"
                if [ -f "$audit" ] && [ "$(jq -r .failed "$audit")" = true ]; then
                  # The PR IS merged but the audit failed. A label on it would stop nothing
                  # (decide scans open PRs only), so name the open successor and halt that.
                  merged_pr=$pr
                  areason=$(jq -r .reason "$audit")
                  audit_alarm() {
                    gh pr comment "$merged_pr" --body "Post-merge audit failed: $areason. $1" || true
                    echo "- AUDIT FAILED for #$merged_pr: $areason" >> "$GITHUB_STEP_SUMMARY"
                    echo "::error::PR #$merged_pr was merged but its audit failed: $areason"
                    exit 1
                  }
                  list_open > "$RUNNER_TEMP/open_after.json" ||
                    audit_alarm "The open PRs could not be re-listed, so no PR was halted. Inspect the merge."
                  # Exit 2 of audit-stop = stop everything: the job fails loudly.
                  succ=$(python3 scripts/train_step.py audit-stop --audit "$audit" --prs "$RUNNER_TEMP/open_after.json") ||
                    audit_alarm "audit-stop failed, so no PR was halted. Inspect the merge."
                  if [[ "$succ" =~ ^[0-9]+$ ]]; then
                    pr=$succ
                    halt "the post-merge audit of #$merged_pr failed: $areason" || true
                    echo "::error::PR #$merged_pr was merged but its audit failed: $areason; #$pr is halted"
                    exit 1
                  fi
                  audit_alarm "No open PR carries train:N, so nothing was halted."
                fi
                case "$outcome" in
                  merged) echo "Merged #$pr (stacked train head, head $sha)" ;;
                  wait) echo "::notice::PR #$pr: merge not done this run: $mreason" ;;
                  *)
                    halt "the merge of this stacked head failed: $mreason" || true
                    echo "::error::PR #$pr: stacked merge failed: $mreason; the train is halted"
                    exit 1
                    ;;
                esac
              fi
              ;;
            update)
              if [ "$mode" = train ]; then
                note="Merge train updated this branch from main at ${GITHUB_SHA}. The head is verified against its reviewed commit before merge."
              else
                note="Branch updated from main at ${GITHUB_SHA}. A reviewer must confirm that the update brings in only main's changes before merge."
              fi
              # update-branch is HTTP 403 for a stacked PR (ADR 0037): never run it on one. If the
              # check itself fails the branch is not updated (the next trigger retries).
              stacked=$(gh api "repos/$GH_REPO/pulls/$pr" --jq '(.stack // null) != null' 2>/dev/null || echo unknown)
              if [ "$stacked" != false ]; then
                echo "::notice::PR #$pr is stacked (or the stack check failed); not running update-branch"
                echo "PR #$pr: stacked or stack check failed; update-branch skipped" >> "$GITHUB_STEP_SUMMARY"
              elif gh pr update-branch "$pr" && gh pr comment "$pr" --body "$note"; then
                :
              else
                echo "::warning::PR #$pr: the update or the comment failed; if the update failed it stays BEHIND until the next trigger, if only the comment failed the branch is already updated"
                echo "PR #$pr: the update or the comment failed (check whether the branch was updated)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              # none or wait: nothing to do this run; the next trigger re-evaluates.
              ;;
          esac
