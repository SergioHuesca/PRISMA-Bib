[build-system]
requires = ["hatchling", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "prismabib"
# Derived from git, never typed here -- see [tool.hatch.version] below.
dynamic = ["version"]
description = "A reproducible PRISMA + bibliometric research lab (Python library + notebooks)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Huesca", email = "sergiohuesca15@gmail.com"}
]
keywords = ["prisma", "systematic-review", "bibliometrics", "scopus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Every dependency below traces to a named row in BUILD_PLAN §2.4 (technology stack),
# §3.7.4 (test toolchain), or a stage that explicitly names it (§3.4 structlog;
# Stage 1 pydantic-settings; Stage 11 typer). Nothing else belongs here: code-reviewer
# rejects scope widening, and an unnamed dependency is scope widening.
dependencies = [
    "pydantic>=2.0",           # §2.4 validation
    "pydantic-settings>=2.0",  # Stage 1 config.py
    "httpx>=0.24.0",           # §2.4 HTTP
    "tenacity>=8.2.0",         # §2.4 retry
    "duckdb>=0.9.0",           # §2.4 store
    "polars>=0.19.0",          # §2.4 dataframes (transform)
    "pandas>=2.0",             # §2.4 dataframes (interop)
    "networkx>=3.1",           # §2.4 graphs
    "pyyaml>=6.0",             # §2.4 config (criteria, rules)
    "structlog>=23.1.0",       # §3.4 logging
    "typer>=0.9.0",            # Stage 11 CLI
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.10.0",
    "jupytext>=1.14.0",        # §2.4 notebook hygiene
]

viz = [
    "plotly>=5.17.0",          # §2.4 figures (interactive)
    "matplotlib>=3.7.0",       # §2.4 figures (camera-ready)
    "panel>=1.3.0",            # §2.4 UI/dashboard
    # Panel's own parameter library, and not scope widening: it arrives with panel
    # either way, and Panel's documented way to run JavaScript and sync a value back
    # to the kernel (`ReactiveHTML`, used by the screening view's keyboard bridge)
    # requires declaring the synced attribute as a `param` object. `screening/ui.py`
    # imports it directly, so it is named here rather than relied on transitively.
    "param>=2.0",
]

docs = [
    # Upper bound is deliberate: MkDocs 2.0 removes the plugin system entirely, which
    # breaks mkdocs-material and mkdocstrings — both mandated by §2.4. Without the
    # bound, a Dependabot PR could resolve to 2.0 and take the docs build down.
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.4.0",  # §2.4 docs
    "mkdocstrings[python]>=0.24.0",
]

dev = [
    "pytest>=7.4.0",           # §3.7.4 runner
    "pytest-cov>=4.1.0",       # §3.7.4 coverage
    "coverage[toml]>=7.3.0",
    "pytest-randomly>=3.14.0", # §3.7.4 order shuffling
    "pytest-socket>=0.6.0",    # §3.7.4 network ban
    "pytest-xdist>=3.3.0",     # §3.7.4 parallelism
    "pytest-benchmark>=4.0.0", # §3.7.4 performance gates
    "respx>=0.21.0",           # §3.7.4 httpx transport mocking
    "hypothesis>=6.87.0",      # §3.7.4 property/stateful
    "polyfactory>=2.13.0",     # §3.7.4 typed factories
    "syrupy>=4.0.0",           # §3.7.4 snapshots
    "time-machine>=2.13.0",    # §3.7.4 deterministic clock
    "dirty-equals>=0.6.0",     # §3.7.4 partial assertions
    "nbmake>=1.5.0",           # §3.7.4 notebook execution
    "mutmut>=2.4.0",           # §3.7.4 mutation testing
    "diff-cover>=7.7.0",       # §3.7.4 changed-line coverage
    "ruff>=0.1.0",             # §2.4 lint/format
    "mypy>=1.6.0",             # §2.4 types
    "types-pyyaml>=6.0.0",
    "nbstripout>=0.7.0",       # §2.4 notebook hygiene
    "pre-commit>=3.5.0",
    "detect-secrets>=1.4.0",   # §2.5 secret guard
]

[project.urls]
Homepage = "https://github.com/SergioHuesca/PRISMA-Bib"
Documentation = "https://SergioHuesca.github.io/PRISMA-Bib/"
Repository = "https://github.com/SergioHuesca/PRISMA-Bib"
Issues = "https://github.com/SergioHuesca/PRISMA-Bib/issues"

# The CLI wrapper of BUILD_PLAN Stage 11 (line 1455). Deliberately only the four
# subcommands whose library function exists and is tested -- `code` and `export` are
# named there too, and are omitted until Stages 8/10 build them, because a stub that
# accepts the command and does nothing useful is how the documented surface stopped
# matching the real one in the first place.
[project.scripts]
prismabib = "prismabib.cli:main"

# The single source of truth for the package version is the git tag, and there is no
# second place it can be typed (`project.version` is now `dynamic`, so hatchling refuses
# a literal there at build time).
#
# This is a provenance control, not packaging tidiness. `capture/writer.py` stamps
# `prismabib.__version__` into every `RunManifest.client_version`, and `raw/<run_id>/` is
# sealed on write (BUILD_PLAN §2.2) -- a wrong value there is permanently unfixable
# without re-capturing against a Scopus index that has since drifted. The repo shipped
# `version = "0.1.0"` through tags v0.2.0 ... v0.5.0 because neither CONTRIBUTING.md's
# Definition of Done nor BUILD_PLAN §3.6.4 has a "bump the version" step; §3.6.4 still
# requires the Release tag and the exported version to agree ("that is what makes an
# exported number traceable to a published state of the code"). A fix that depends on
# someone remembering would fail the same way again, so nobody is asked to remember.
#
# What the derived value looks like, all of it PEP 440:
#   at tag v0.5.0, clean tree ....... 0.5.0
#   2 commits past it, clean ........ 0.5.0.post1.dev2+g696a64c4e
#   ... with uncommitted edits ...... 0.5.0.post1.dev2+g696a64c4e.d20260826
#   shallow/tagless clone ........... 0.post1.dev1+unknown.g696a64c4e
#   no .git at all (tarball) ........ 0+unknown
# `version_scheme = "no-guess-dev"` is why an untagged commit reads `0.5.0.post1.dev2`
# ("past 0.5.0") instead of setuptools-scm's default guess `0.5.1.dev2`, which names a
# release that does not exist and would be indistinguishable, in a sealed manifest, from
# a real v0.5.1 prerelease. The two degraded cases both keep the commit hash and say
# `unknown`/`0` out loud rather than reporting a plausible release number.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }
fallback-version = "0+unknown"

[tool.uv]
# `git` here is what makes the derived version self-maintaining for an editable install:
# the version is baked into `.dist-info` at build time, so without this, `uv run` would
# happily keep serving the version computed at the last `uv sync` -- i.e. exactly the
# stale-number failure this whole section exists to prevent -- until someone thought to
# reinstall. With it, committing or tagging rebuilds the package on the next `uv run`.
# `file = "pyproject.toml"` is uv's default cache key and must be restated, because
# supplying `cache-keys` replaces the default rather than extending it; dropping it would
# stop dependency edits from triggering a rebuild.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/prismabib"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — the formatter owns line breaking
]

[tool.ruff.lint.isort]
known-first-party = ["prismabib"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F841", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
files = ["src/prismabib"]

# numpy ships PEP 695 `type` statements in its stubs (numpy/__init__.pyi), which are
# 3.12+ syntax. Parsing them under python_version = "3.11" is a hard syntax error that
# aborts the whole run. numpy arrives transitively (pydantic -> rich -> IPython, and
# matplotlib in the viz extra); prismabib never imports it directly, so skipping its
# stubs costs no type safety in our own code.
#
# Deliberately NOT solved by raising python_version to "3.12": the CI matrix runs the
# suite on 3.11, and the 3.11 type target is what catches typing our code uses that
# 3.11 cannot execute. Losing that would trade a real guarantee for a cosmetic one.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# pandas ships no type stubs, and `pandas-stubs` is not in §2.4's closed dependency
# list. pandas is used in exactly one place -- `store/load.py`'s bulk-insert transfer
# format -- so treating it as untyped costs no real safety here, and pulling in a
# dependency purely to satisfy a type checker would be the larger deviation.
[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true

# Panel ships no type information for its widget constructors, so every
# `pn.widgets.Button(...)` is a call to an untyped function under --strict.
# Scoped to `panel.*` alone: the screening view's own signatures, view model and
# key map stay fully checked, and only the widget construction it cannot type is
# exempt. Narrower than silencing the error code project-wide.
[[tool.mypy.overrides]]
module = ["panel", "panel.*"]
ignore_missing_imports = true

# `disallow_untyped_calls` is enforced at the *call site*, so exempting `panel`
# itself does nothing -- the exemption has to name the module doing the calling.
# Scoped to this one module, which is the only place Panel widgets are
# constructed, and to that single rule: `screening/ui.py`'s own signatures,
# return types, view model and key map remain fully checked under --strict.
# It is the same module §3.7.6 already treats specially with a 60% line gate,
# for the same reason -- the widget layer is the part that cannot be verified
# the way the rest of the codebase is.
[[tool.mypy.overrides]]
module = ["prismabib.screening.ui"]
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/prismabib"]
branch = true

[tool.coverage.report]
skip_covered = false
skip_empty = true
precision = 2
show_missing = true
# Global gate, BUILD_PLAN §3.7.6 "Global | >= 85%". This is the only threshold
# coverage.py can enforce natively; the per-module gates below are enforced by the
# `gates` CI job because coverage.py has no per-path fail_under.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*@(abstractmethod|overload)",
    "^\\s*class .*\\(Protocol\\):",
]

[tool.coverage.paths]
source = [
    "src/prismabib",
    "*/site-packages/prismabib",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

# Per-module coverage gates, transcribed from the BUILD_PLAN §3.7.6 table.
#
# This is a prismabib-owned table, NOT a coverage.py section: coverage.py supports a
# single global `fail_under` and has no per-path threshold mechanism. Declaring these
# under [tool.coverage.*] would be inert config that silently enforces nothing, which is
# exactly the "quiet gate erosion" the Stage 0 meta-test exists to prevent.
#
# Two consumers, and they must agree:
#   1. test_coverage_config__gates__match_the_build_plan parses this table and asserts
#      every threshold equals §3.7.6.
#   2. The `gates` CI job (§3.7.7) reads coverage.json and fails the build on any breach.
[tool.prismabib.coverage_gates]
global = {line = 85}
"src/prismabib/prisma/engine.py" = {line = 100, branch = 100}
"src/prismabib/prisma/log.py" = {line = 100, branch = 100}
"src/prismabib/prisma/flow.py" = {line = 100, branch = 100}
"src/prismabib/store" = {line = 95, branch = 90}
"src/prismabib/taxonomy" = {line = 95, branch = 90}
"src/prismabib/bibliometrics" = {line = 90}
"src/prismabib/report" = {line = 90}
"src/prismabib/sources" = {line = 85}
"src/prismabib/fulltext" = {line = 85}
"src/prismabib/viz" = {line = 60}
"src/prismabib/screening/ui.py" = {line = 60}

# diff-cover gate on changed lines in a PR (§3.7.6: ">= 90% coverage on lines changed").
[tool.prismabib.diff_cover]
fail_under = 90

# Mutation testing scope, BUILD_PLAN §3.7.6 (">= 85% kill rate") and the weekly job of
# §3.7.7. `.github/workflows/weekly-mutation.yml` runs it; nothing else reads this table.
#
# BUILD_PLAN line 580 spells the weekly run as
#     mutmut run --paths-to-mutate src/prismabib/prisma,src/prismabib/taxonomy
# which is the mutmut *2.x* CLI. uv.lock resolves mutmut 3.7.0, whose `run` accepts only
# `[MUTANT_NAMES]... --max-children` and takes its scope from this section instead. The
# deviation is recorded in ADR 0009.
#
# `source_paths` is the whole package, not just prisma/, on purpose: mutmut copies exactly
# these paths into `mutants/` and then puts `mutants/src` on sys.path. Narrowing it to
# `src/prismabib/prisma` would leave `mutants/src/prismabib/__init__.py` absent and every
# test would fail at import. `only_mutate` is what actually confines mutation to prisma/.
[tool.mutmut]
# Diagnostic prose and SQL text are exempted from mutation with
# `# pragma: no mutate start/end` at the statement, and the reason is not
# convenience. mutmut generates three mutants per string segment -- an
# `XX..XX` sentinel wrap, a lowercased copy, an uppercased copy -- so a
# carefully written multi-paragraph error message produces dozens of mutants
# that no behaviour can distinguish. Killing them means asserting the message
# verbatim, character and case, which yields a change-detector test that
# breaks on every rewording while catching no defect: §5 risk 12, arrived at
# from the opposite direction.
#
# Measured on the first real run (2026-08-31): of 1016 mutants, 211 were
# string-literal-only and 131 of those survived. The kill rate over mutants
# that can change behaviour was 92.92%; the reported rate was 81.50%. Killing
# every remaining structural survivor would still have landed at 84.8%, so
# the 85% gate was unreachable while prose was counted -- the project was
# being penalised for writing good diagnostics.
#
# The exemption is per-statement and deliberately narrow. It covers the
# message body of a multi-line `raise`, and the SQL passed to
# `connection.execute` (SQL keywords and unquoted identifiers are
# case-insensitive, so a case mutation there is inert by definition). It does
# NOT cover the condition that decides whether to raise, and it does NOT
# cover short semantic strings -- `"shared"`/`"exclusive"` lock modes,
# `"--format=%H"`, stage names, decision values, reason codes -- all of which
# stay mutated, because flipping their case genuinely changes behaviour and a
# test that fails to notice is a real gap.
source_paths = ["src/prismabib"]
# Add "src/prismabib/taxonomy/*" here at Stage 8, when that package exists — BUILD_PLAN
# line 580 names it as in scope. Naming it before it exists only makes the run fail.
only_mutate = ["src/prismabib/prisma/*"]
# Mutants are only worth generating for code the PRISMA suite exercises, and the whole
# test suite cannot run from inside `mutants/`: the Stage 0 meta-tests read repository
# files (BUILD_PLAN.md, .github/, .pre-commit-config.yaml) that are not part of the
# copied tree. Restricting selection to the prisma tests keeps the run honest and fast.
# A mutant killed *only* by a test outside this selection is reported as survived, which
# errs toward more work, not less.
pytest_add_cli_args_test_selection = [
    "tests/unit/prisma",
    "tests/integration/prisma",
    "tests/property/test_engine_invariants.py",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --strict-markers per BUILD_PLAN line 647: an unregistered marker must be an error,
# not a silent typo.
addopts = [
    "--strict-markers",
    "--strict-config",
    # BUILD_PLAN §3.7.2 line 492: "Default run is `pytest -m 'not live'`".
    # This is a safety control, not a convenience. The `live` tests in
    # tests/live/ push branches to origin, open real pull requests, and attempt a
    # push to refs/heads/main. Without this, a contributor typing bare `pytest`
    # mutates the GitHub repository. Run them deliberately with `-m live`.
    "-m",
    "not live",
]
markers = [
    # The seven kinds of BUILD_PLAN §3.7.2. Every test belongs to exactly one.
    "unit: pure logic, no I/O, < 50 ms",
    "integration: real DuckDB, real filesystem, mocked network, < 2 s",
    "contract: payload-shape tests against recorded cassettes, < 200 ms",
    "property: hypothesis invariants over generated inputs, < 10 s",
    "golden: snapshot/approval tests, < 1 s",
    "e2e: full pipeline on the frozen fixture project, < 60 s",
    "live: hits real APIs; deselected by default, runs nightly",
    # Traceability marker of §3.7.8, e.g. @pytest.mark.acceptance("S04-AC3").
    "acceptance(criterion): claims a numbered stage acceptance criterion",
    # Named as a test kind in the Stage 3/5/9 Tests tables. Registered so that
    # --strict-markers does not reject the plan's own named tests.
    "notebook: nbmake execution of a notebook against the fixture project",
]
