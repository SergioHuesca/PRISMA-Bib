# --- Stage 0 -- Repository bootstrap (BUILD_PLAN.md lines 629-634) ---------

S00-AC1 = "The GitHub repository exists, `git remote -v` in the working clone shows it as `origin`, and `main` is pushed."
S00-AC2 = "`uv sync && uv run pytest` green from a clean clone taken from GitHub, not from the original working copy."
S00-AC3 = "`uv run mkdocs build --strict` succeeds, and the `docs.yml` workflow has published the site to GitHub Pages at least once."
S00-AC4 = "`pre-commit run --all-files` clean."
S00-AC5 = "CI green on a throwaway PR on GitHub, and that PR demonstrably cannot be merged while a check is red -- verified by pushing a deliberately failing commit and confirming the merge button is blocked."
S00-AC6 = "A direct `git push origin main` is rejected by branch protection."

# --- Stage 1 -- Domain model (BUILD_PLAN.md lines 724-727) -----------------

S01-AC1 = "`Project.init(\"demo\")` creates the full skeleton and is idempotent."
S01-AC2 = "Round-trip: `Record` -> `model_dump_json()` -> `model_validate_json()` is lossless for a synthetic fixture with missing optional fields, list-vs-scalar affiliations, and non-ASCII author names."
S01-AC3 = "`PayloadRef` can locate the originating raw line for any record."

# --- Stage 2 -- Scopus acquisition and Layer 0 capture (BUILD_PLAN.md lines 802-807) ---

S02-AC1 = "A search run writes `raw/<run_id>/page-0000.jsonl ...` plus `raw/<run_id>/manifest.json`."
S02-AC2 = "Re-running with the cache warm produces a byte-identical payload hash."
S02-AC3 = "Killing the process mid-run and restarting resumes from the persisted cursor with no duplicate pages."
S02-AC4 = "A 403 on `view=COMPLETE` raises `EntitlementError` with a message naming the missing entitlement -- never falls back to `STANDARD`."
S02-AC5 = "The reported `total_results` is recorded in the manifest and is the only source of the PRISMA \"records identified\" number."

# --- Stage 3 -- Normalised store, Layer 1 (BUILD_PLAN.md lines 900-904) ----

S03-AC1 = "`build_store(project, rebuild=True)` on the same Layer 0 input produces a byte-stable set of table checksums."
S03-AC2 = "Every `records.payload_file`/`payload_line` pair resolves to a valid raw JSON object."
S03-AC3 = "Deleting `corpus.duckdb` and rebuilding loses nothing."
S03-AC4 = "Loading is idempotent: running it twice does not duplicate rows."
