# Declared acceptance criteria, BUILD_PLAN.md §3.7.8.
#
# Each entry is `"S<NN>-AC<n>" = "<description>"`, transcribed verbatim (trimmed
# for length where BUILD_PLAN's prose runs on) from that stage's **Acceptance
# criteria** list. `pytest --acceptance-report` (tests/markers.py) reads this
# table and fails the run if any key here has no test claiming it via
# `@pytest.mark.acceptance("S<NN>-AC<n>")`.
#
# Later stages APPEND their own criteria here; never remove or renumber an
# existing entry — that would silently un-claim history.

[criteria]

# --- Stage 0 -- Repository bootstrap (BUILD_PLAN.md lines 629-634) ---------

S00-AC1 = "The GitHub repository exists, `git remote -v` in the working clone shows it as `origin`, and `main` is pushed."
S00-AC2 = "`uv sync && uv run pytest` green from a clean clone taken from GitHub, not from the original working copy."
S00-AC3 = "`uv run mkdocs build --strict` succeeds, and the `docs.yml` workflow has published the site to GitHub Pages at least once."
S00-AC4 = "`pre-commit run --all-files` clean."
S00-AC5 = "CI green on a throwaway PR on GitHub, and that PR demonstrably cannot be merged while a check is red -- verified by pushing a deliberately failing commit and confirming the merge button is blocked."
S00-AC6 = "A direct `git push origin main` is rejected by branch protection."

# --- Stage 1 -- Domain model (BUILD_PLAN.md lines 724-727) -----------------

S01-AC1 = "`Project.init(\"demo\")` creates the full skeleton and is idempotent."
S01-AC2 = "Round-trip: `Record` -> `model_dump_json()` -> `model_validate_json()` is lossless for a synthetic fixture with missing optional fields, list-vs-scalar affiliations, and non-ASCII author names."
S01-AC3 = "`PayloadRef` can locate the originating raw line for any record."

# --- Stage 2 -- Scopus acquisition and Layer 0 capture (BUILD_PLAN.md lines 802-807) ---

S02-AC1 = "A search run writes `raw/<run_id>/page-0000.jsonl ...` plus `raw/<run_id>/manifest.json`."
S02-AC2 = "Re-running with the cache warm produces a byte-identical payload hash."
S02-AC3 = "Killing the process mid-run and restarting resumes from the persisted cursor with no duplicate pages."
S02-AC4 = "A 403 on `view=COMPLETE` raises `EntitlementError` with a message naming the missing entitlement -- never falls back to `STANDARD`."
S02-AC5 = "The reported `total_results` is recorded in the manifest and is the only source of the PRISMA \"records identified\" number."

# --- Stage 3 -- Normalised store, Layer 1 (BUILD_PLAN.md lines 900-904) ----

S03-AC1 = "`build_store(project, rebuild=True)` on the same Layer 0 input produces a byte-stable set of table checksums."
S03-AC2 = "Every `records.payload_file`/`payload_line` pair resolves to a valid raw JSON object."
S03-AC3 = "Deleting `corpus.duckdb` and rebuilding loses nothing."
S03-AC4 = "Loading is idempotent: running it twice does not duplicate rows."

# --- Stage 4 -- PRISMA engine, Layer 2 (BUILD_PLAN.md lines 997-1002) ------

S04-AC1 = "Hypothesis property tests: for random event streams, `|C| <= |M_abs| <= |S_raw and A and L| <= |S_raw|` always holds."
S04-AC2 = "Superseding: appending a reversal event flips membership and leaves the original event readable."
S04-AC3 = "Tampering with `decisions.jsonl` by hand causes `LogError` on next load."
S04-AC4 = "`FlowCounts.assert_consistent()` passes on the reference fixture and fails on a deliberately corrupted one."
S04-AC5 = "Given the reference project's criteria and a fixed synthetic corpus, flow counts are reproducible to the integer across three fresh runs."

# --- Stage 5 -- Screening UI (BUILD_PLAN.md lines 1091-1096) ---------------
#
# Four of the five. AC2 was claimed by the queue; AC1, AC3 and AC4 are the
# view's, and are declared here in the PR that builds it. This file must never
# declare a criterion no test claims -- an unclaimed entry fails the run
# (tests/markers.py), which is the whole point of it.
#
# S05-AC5 (>= 4 records/minute measured throughput) is deliberately absent. It
# is validated by human timing in Stage 11 and recorded in docs: BUILD_PLAN
# line 1112 says so explicitly and warns against faking it with a
# simulated-input test, so it stays undeclared until that measurement is
# actually made. Declaring it against a test that simulates keystrokes would
# claim a fact about a *practised human reviewer* from a fact about a CPU.

S05-AC1 = "Rendering `screener(...)` in a notebook cell produces a working interface; the same object serves via `panel serve` with no code change."
S05-AC2 = "Deciding 20 records, restarting the kernel, and re-opening resumes at record 21."
S05-AC3 = "Every decision appears in `decisions.jsonl` within 100 ms."
S05-AC4 = "Keyboard bindings work without the mouse entering the widget."

# --- Stage 10 -- Reporting and export (BUILD_PLAN.md lines 1400-1430) ------
#
# Scoped by ADR 0015: BUILD_PLAN's Stage 10 also lists a taxonomy distribution,
# a dataset/benchmark usage table and a research-gap table, which read Stage 8
# and Stage 9 output that does not exist -- the amended plan moved this stage
# ahead of 6-9 deliberately. All four acceptance criteria below are reachable
# without them, which is what made the move safe.

S10-AC1 = "Every exported figure has its source CSV beside it."
S10-AC2 = "`manifest.json` includes the git commit SHA; exporting from a dirty working tree emits a loud warning and marks `dirty: true`."
S10-AC3 = "`prismabib fill` on a manuscript containing an undefined key exits non-zero."
S10-AC4 = "The generated PRISMA diagram's numbers equal `FlowCounts` by test assertion."

# --- Stage 6 -- Full-text resolution and eligibility (BUILD_PLAN.md lines 1150-1154) ---
#
# Implemented after Stage 10 in build order (ADR 0015 moved Stages 6-9 behind
# 10), which is why this section sits here rather than between Stage 5 and
# Stage 10 above -- this file's sections follow implementation order, not
# BUILD_PLAN's stage numbering.

S06-AC1 = "Resolver chain is unit-tested with each resolver failing in turn."
S06-AC2 = "A 403 on resolver 1 provably reaches resolver 3 in tests."
S06-AC3 = "Coverage report renders and shows per-publisher counts."
S06-AC4 = "No code path can write an INACCESSIBLE decision event."

# --- Stage 7 -- Bibliometrics engine (BUILD_PLAN.md lines 1180-1256) -------
#
# Implemented after Stage 10 and alongside Stage 6 (ADR 0015 moved Stages
# 6-9 behind 10; §7 of EXECUTION_PLAN permits 6/7/8 concurrently), which is
# why this section sits after Stage 6 above rather than between Stage 4 and
# Stage 10 -- this file's sections follow implementation order, not
# BUILD_PLAN's stage numbering (see the Stage 6 section's own note).

S07-AC1 = "Every function returns AnalysisResult; none returns a bare number or dataframe."
S07-AC2 = "CAGR on a synthetic series with known growth returns the analytic answer to 1e-9."
S07-AC3 = "h-index verified against a hand-computed fixture."
S07-AC4 = "Changing min_occurrence changes params and therefore the caption."
S07-AC5 = "Recomputation on an unchanged store is bit-identical."
